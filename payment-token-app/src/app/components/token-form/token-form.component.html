<mat-card>
  <mat-card-header>
    <mat-card-title>Tokenize Bank Account</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Account Number</mat-label>
        <input matInput formControlName="accountNumber" placeholder="8-17 digits" />
        @if (form.get('accountNumber')?.hasError('pattern')) {
          <mat-error>Must be 8–17 digits</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Routing Number</mat-label>
        <input matInput formControlName="routingNumber" placeholder="9 digits" />
        @if (form.get('routingNumber')?.hasError('pattern')) {
          <mat-error>Must be exactly 9 digits</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Customer ID</mat-label>
        <input matInput formControlName="customerId" />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Tokenize
      </button>
    </form>
  </mat-card-content>
</mat-card>
